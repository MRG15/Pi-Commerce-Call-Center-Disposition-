name: Neon Production Migration

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardened migration branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decrypt historical source workbook
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_DATA_KEY: ${{ secrets.MIGRATION_DATA_KEY }}
          MIGRATION_PAYLOAD_ISSUE: '1'
          MIGRATION_SOURCE_XLSX: /tmp/Disposition-Sheet-Sellers.xlsx
        run: node scripts/fetch-migration-payload.mjs

      - name: Run atomic Neon migration and reconciliation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/migrate-neon.ts /tmp/Disposition-Sheet-Sellers.xlsx

      - name: Remove decrypted temporary workbook
        if: always()
        run: rm -f /tmp/Disposition-Sheet-Sellers.xlsx
