<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Commerce · Disposition Platform</title>
<style>
  :root {
    --navy: #002970;
    --cyan: #00BAF2;
    --navy-light: #1a3d80;
    --bg: #f5f7fb;
    --card: #ffffff;
    --border: #e2e6ed;
    --text: #1a1f36;
    --text-muted: #6b7280;
    --text-light: #9ca3af;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --warn: #f59e0b;
    --warn-bg: #fffbeb;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --neutral-bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); padding: 20px; }
  .login-card { background: white; border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .login-logo { font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .login-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; background: white; transition: border-color 0.15s; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,186,242,0.12); }
  .btn { width: 100%; padding: 11px; background: var(--navy); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .btn:hover:not(:disabled) { background: var(--navy-light); }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-cyan { background: var(--cyan); color: var(--navy); }
  .btn-cyan:hover:not(:disabled) { background: #00a8db; }
  .error { color: var(--danger); font-size: 12px; margin-top: 8px; }
  .hint { font-size: 11px; color: var(--text-light); margin-top: 14px; text-align: center; }

  /* APP */
  .app { display: none; min-height: 100vh; }
  .app.active { display: block; }
  .header { background: var(--navy); color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 15px; font-weight: 600; }
  .header-title span { color: var(--cyan); }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; }
  .agent-badge { background: rgba(255,255,255,0.12); padding: 5px 12px; border-radius: 20px; font-weight: 500; }
  .logout-link { color: white; text-decoration: none; opacity: 0.8; font-size: 12px; cursor: pointer; }
  .logout-link:hover { opacity: 1; text-decoration: underline; }

  .main { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px; }
  .search-row { display: flex; gap: 10px; }
  .search-row input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; font-family: inherit; letter-spacing: 0.3px; }
  .search-row input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,186,242,0.12); }
  .search-row button { padding: 0 20px; background: var(--navy); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
  .search-row button:hover { background: var(--navy-light); }

  .toast { position: fixed; top: 70px; right: 24px; background: var(--success); color: white; padding: 12px 20px; border-radius: 6px; font-weight: 500; font-size: 13px; box-shadow: 0 8px 24px rgba(16,185,129,0.35); opacity: 0; transform: translateY(-10px); transition: all 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* HISTORY */
  .history-empty { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; background: var(--neutral-bg); border-radius: 8px; }
  .history-empty strong { color: var(--navy); display: block; margin-bottom: 4px; font-size: 14px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
  .history-header .count { background: var(--cyan); color: var(--navy); padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 11px; }
  .call-list { display: flex; flex-direction: column; gap: 0; }
  .call-item { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; position: relative; }
  .call-arrow { display: flex; justify-content: center; padding: 4px 0; color: var(--cyan); font-size: 18px; line-height: 1; }
  .call-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .call-date { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .call-agent { font-size: 11px; color: var(--text-light); }
  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .status-payment_done, .status-payment { background: var(--success-bg); color: var(--success); }
  .status-call_back, .status-callback { background: #eff6ff; color: #2563eb; }
  .status-not_interested { background: var(--danger-bg); color: var(--danger); }
  .status-voice_mail, .status-voicemail { background: var(--neutral-bg); color: var(--text-muted); }
  .status-wrap_up, .status-disconnected { background: var(--warn-bg); color: var(--warn); }
  .status-default { background: var(--neutral-bg); color: var(--text-muted); }
  .call-remark { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.45; }
  .call-remark.empty { color: var(--text-light); font-style: italic; }
  .call-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 2px 6px; background: var(--neutral-bg); color: var(--text-muted); border-radius: 3px; font-weight: 500; }

  /* DISPOSITION FORM */
  .dispo-form .field { margin-bottom: 14px; }
  .dispo-form select, .dispo-form textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; background: white; }
  .dispo-form select:focus, .dispo-form textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,186,242,0.12); }
  .dispo-form select:disabled { background: var(--neutral-bg); color: var(--text-light); cursor: not-allowed; }
  .dispo-form textarea { min-height: 60px; resize: vertical; }
  .modifier-box { background: var(--neutral-bg); border-radius: 6px; padding: 12px 14px; display: none; }
  .modifier-box.show { display: block; }
  .modifier-box .field-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .radio-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .radio-row label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .radio-row input[type=radio] { accent-color: var(--cyan); }
  .required { color: var(--danger); }
  .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .submit-row { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .submit-row button { flex: 1; padding: 12px; background: var(--cyan); color: var(--navy); border: none; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; letter-spacing: 0.3px; }
  .submit-row button:hover:not(:disabled) { background: #00a8db; }
  .submit-row button:disabled { background: var(--neutral-bg); color: var(--text-light); cursor: not-allowed; }
  .clear-btn { flex: 0 0 auto !important; background: white !important; color: var(--text-muted) !important; border: 1px solid var(--border) !important; padding: 12px 16px !important; font-weight: 500 !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">Pi Commerce</div>
    <div class="login-sub">Disposition Platform · Agent Login</div>
    <div class="field">
      <label>Agent name</label>
      <select id="loginName">
        <option value="">Select</option>
        <option>Sheena</option>
        <option>Umesh</option>
        <option>Ashish</option>
        <option>Madhav</option>
      </select>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password">
    </div>
    <button class="btn" id="loginBtn">Login</button>
    <div class="error" id="loginErr"></div>
    <div class="hint">Demo password: <b>paytm123</b></div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="app">
  <div class="header">
    <div class="header-title">Pi Commerce <span>·</span> Disposition Platform</div>
    <div class="header-right">
      <div class="agent-badge" id="agentBadge">Agent</div>
      <a class="logout-link" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div class="main">
    <!-- SECTION 1: SEARCH -->
    <div class="section">
      <div class="section-label">1 · Customer ID</div>
      <div class="search-row">
        <input type="text" id="cidInput" placeholder="Paste or type customer ID" inputmode="numeric" autocomplete="off">
        <button id="fetchBtn">Fetch</button>
      </div>
    </div>

    <!-- SECTION 2: HISTORY -->
    <div class="section" id="historySection" style="display:none">
      <div class="section-label">2 · Call History</div>
      <div id="historyBody"></div>
    </div>

    <!-- SECTION 3: NEW DISPOSITION -->
    <div class="section" id="dispoSection" style="display:none">
      <div class="section-label">3 · Log New Disposition</div>
      <div class="dispo-form">
        <div class="field">
          <label class="field-label">L0 — Call Outcome <span class="required">*</span></label>
          <select id="l0"><option value="">Select outcome</option></select>
        </div>
        <div class="field" id="l1Wrap" style="display:none">
          <label class="field-label">L1 — Reason</label>
          <select id="l1"><option value="">Select</option></select>
        </div>
        <div class="field" id="l2Wrap" style="display:none">
          <label class="field-label">L2 — Specific Issue</label>
          <select id="l2"><option value="">Select</option></select>
        </div>

        <div class="modifier-box" id="fbBox">
          <div class="field-label">Facebook Page Status</div>
          <div class="radio-row">
            <label><input type="radio" name="fb" value="Already existed"> Already existed</label>
            <label><input type="radio" name="fb" value="Created on call"> Created on call</label>
            <label><input type="radio" name="fb" value="Not created yet"> Not created yet</label>
          </div>
        </div>

        <div class="field" style="margin-top:14px">
          <label class="field-label">Remark <span id="remarkReq" style="display:none" class="required">*</span></label>
          <textarea id="remark" placeholder="Notes, callback time, specific complaint (optional unless callback)"></textarea>
        </div>

        <div class="submit-row">
          <button class="clear-btn" id="clearBtn">Clear</button>
          <button id="submitBtn" disabled>Log Disposition</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Disposition logged</div>

// LOGIN
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
loginBtn.onclick = () => {
  const name = document.getElementById('loginName').value;
  const pass = document.getElementById('loginPass').value;
  if (!name) { loginErr.textContent = "Select agent name"; return; }
  if (pass !== 'paytm123') { loginErr.textContent = "Incorrect password"; return; }
  SESSION.agent = name;
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').classList.add('active');
  document.getElementById('agentBadge').textContent = name;
  document.getElementById('cidInput').focus();
};
document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') loginBtn.click(); });

document.getElementById('logoutBtn').onclick = () => {
  if (confirm('Logout?')) location.reload();
};

const historySection = document.getElementById('historySection');
const historyBody = document.getElementById('historyBody');
const dispoSection = document.getElementById('dispoSection');

document.getElementById('fetchBtn').onclick = fetchHistory;
cidInput.addEventListener('keypress', e => { if (e.key === 'Enter') fetchHistory(); });

function statusClass(s) {
  const k = (s || '').toLowerCase().replace(/[^a-z]+/g, '_').replace(/^_|_$/g, '');
  const known = ['payment_done','payment','call_back','callback','not_interested','voice_mail','voicemail','wrap_up','disconnected'];
  return known.includes(k) ? 'status-' + k : 'status-default';
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}

function fetchHistory() {
  const cid = cidInput.value.trim();
  if (!cid) return;
  const calls = HISTORY[cid];
  historySection.style.display = 'block';
  dispoSection.style.display = 'block';
  resetForm();

  if (!calls || calls.length === 0) {
    historyBody.innerHTML = `<div class="history-empty"><strong>New Customer</strong>No previous call history for ID ${cid}</div>`;
  } else {
    let html = `<div class="history-header"><div>Sorted oldest → newest</div><div><span class="count">${calls.length}</span> previous call${calls.length>1?'s':''}</div></div><div class="call-list">`;
    calls.forEach((c, i) => {
      const tags = [];
      if (c.wa && c.wa.toLowerCase() === 'yes') tags.push('WA handoff');
      if (c.fb_pending && c.fb_pending.toLowerCase() === 'yes') tags.push('FB link pending');
      html += `<div class="call-item">
        <div class="call-meta">
          <span class="call-date">${fmtDate(c.date)} · <span class="call-agent">${c.agent}</span></span>
          <span class="status-pill ${statusClass(c.status)}">${c.status}</span>
        </div>
        <div class="call-remark ${c.remark ? '' : 'empty'}">${c.remark ? escapeHtml(c.remark) : 'No remark logged'}</div>
        ${tags.length ? '<div class="call-tags">' + tags.map(t => `<span class="tag">${t}</span>`).join('') + '</div>' : ''}
      </div>`;
      if (i < calls.length - 1) html += '<div class="call-arrow">↓</div>';
    });
    html += '</div>';
    historyBody.innerHTML = html;
  }
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// DISPOSITION FORM
const l0 = document.getElementById('l0'), l1 = document.getElementById('l1'), l2 = document.getElementById('l2');
const l1Wrap = document.getElementById('l1Wrap'), l2Wrap = document.getElementById('l2Wrap');
const fbBox = document.getElementById('fbBox');
const remark = document.getElementById('remark');
const remarkReq = document.getElementById('remarkReq');
const submitBtn = document.getElementById('submitBtn');
const clearBtn = document.getElementById('clearBtn');

Object.keys(TREE).forEach(k => {
  const o = document.createElement('option');
  o.value = k; o.textContent = k; l0.appendChild(o);
});

function fillSelect(sel, arr) {
  sel.innerHTML = '<option value="">Select</option>';
  arr.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v; sel.appendChild(o);
  });
}

l0.onchange = () => {
  const l1Options = Object.keys(TREE[l0.value] || {});
  if (l1Options.length) {
    fillSelect(l1, l1Options);
    l1Wrap.style.display = 'block';
  } else {
    l1Wrap.style.display = 'none';
    l1.value = '';
  }
  l2Wrap.style.display = 'none'; l2.value = '';
  fbBox.classList.remove('show');
  document.querySelectorAll('input[name=fb]').forEach(r => r.checked = false);
  remarkReq.style.display = 'none';
  validate();
};

l1.onchange = () => {
  const l2Options = (TREE[l0.value] || {})[l1.value] || [];
  if (l2Options.length) {
    fillSelect(l2, l2Options);
    l2Wrap.style.display = 'block';
  } else {
    l2Wrap.style.display = 'none';
    l2.value = '';
  }
  fbBox.classList.toggle('show', FB_L1.includes(l1.value));
  if (!FB_L1.includes(l1.value)) document.querySelectorAll('input[name=fb]').forEach(r => r.checked = false);
  remarkReq.style.display = CALLBACK_L1.includes(l1.value) ? 'inline' : 'none';
  validate();
};

l2.onchange = validate;
remark.oninput = validate;
document.querySelectorAll('input[name=fb]').forEach(r => r.onchange = validate);

function validate() {
  let ok = !!l0.value;
  const l1Options = Object.keys(TREE[l0.value] || {});
  if (l1Options.length && !l1.value) ok = false;
  const l2Options = (TREE[l0.value] || {})[l1.value] || [];
  if (l2Options.length && !l2.value) ok = false;
  if (FB_L1.includes(l1.value) && !document.querySelector('input[name=fb]:checked')) ok = false;
  if (CALLBACK_L1.includes(l1.value) && !remark.value.trim()) ok = false;
  submitBtn.disabled = !ok;
}

function resetForm() {
  l0.value = ''; l1.value = ''; l2.value = '';
  l1Wrap.style.display = 'none'; l2Wrap.style.display = 'none';
  fbBox.classList.remove('show');
  document.querySelectorAll('input[name=fb]').forEach(r => r.checked = false);
  remark.value = '';
  remarkReq.style.display = 'none';
  submitBtn.disabled = true;
}

clearBtn.onclick = resetForm;

submitBtn.onclick = () => {
  const cid = cidInput.value.trim();
  const fb = document.querySelector('input[name=fb]:checked');
  const entry = {
    date: new Date().toISOString().slice(0,10),
    agent: SESSION.agent,
    status: l0.value,
    l1: l1.value,
    l2: l2.value,
    fb: fb ? fb.value : '',
    remark: remark.value.trim()
  };
  // Add to in-memory history (prototype)
  const statusMap = { "Interested": "Interested", "Not Interested": "Not Interested", "Callback — pre-pitch": "Call Back", "Wrong contact / not operational": "Wrong Contact", "Voicemail": "Voice Mail", "Disconnected": "Disconnected" };
  const finalStatus = l1.value === 'Payment done' ? 'Payment Done' : (statusMap[l0.value] || l0.value);
  const remarkText = [entry.l1, entry.l2, entry.fb, entry.remark].filter(Boolean).join(' · ');
  if (!HISTORY[cid]) HISTORY[cid] = [];
  HISTORY[cid].push({ date: entry.date, agent: entry.agent, status: finalStatus, remark: remarkText, wa: entry.l1 === 'Taken to WhatsApp for closure' ? 'Yes' : '', fb_pending: entry.fb === 'Not created yet' ? 'Yes' : '' });

  // Toast + reset
  const toast = document.getElementById('toast');
  toast.textContent = `Logged for ${cid}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);

  // Clear cust_id and everything else
  cidInput.value = '';
  historySection.style.display = 'none';
  dispoSection.style.display = 'none';
  resetForm();
  cidInput.focus();
};
</script>
</body>
</html>
